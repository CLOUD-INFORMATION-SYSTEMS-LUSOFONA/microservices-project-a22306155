---
- name: Deploy stack
  hosts: web_servers
  become: yes

  tasks:

    - name: Create app directory
      file:
        path: /opt/app
        state: directory
        mode: '0755'

    - name: Copy docker-compose
      copy:
        src: ../files/docker-compose.yml
        dest: /opt/app/docker-compose.yml
        mode: '0644'

    - name: Pull images
      command: docker compose pull
      args:
        chdir: /opt/app

    - name: Start stack
      command: docker compose up -d
      args:
        chdir: /opt/app