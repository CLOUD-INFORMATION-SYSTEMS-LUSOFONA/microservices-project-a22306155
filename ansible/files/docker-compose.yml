version: "3.8"

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cloudprojectdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  user-service:
    image: miguelrodr1gues/user-service:2.0
    ports:
      - "8081:8080"
    depends_on:
      - postgres
      - kafka

  product-service:
    image: miguelrodr1gues/product-service:2.0
    ports:
      - "8082:8080"
    depends_on:
      - postgres
      - kafka

  order-service:
    image: miguelrodr1gues/order-service:2.0
    ports:
      - "8083:8080"
    depends_on:
      - postgres
      - kafka

  api-gateway:
    image: miguelrodr1gues/api-gateway:2.0
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - product-service
      - order-service